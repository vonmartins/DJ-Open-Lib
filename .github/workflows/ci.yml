name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run --frozen ruff check

      - name: Format
        run: uv run --frozen ruff format --check

      - name: Type check
        run: uv run --frozen pyright

      - name: Test
        run: uv run --frozen pytest --durations=25

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install
        run: uv sync --locked --group docs

      - name: Build
        run: uv run --frozen zensical build --strict

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check --strict dist/*

      - name: Check sdist contents
        run: |
          tar tzf dist/*.tar.gz | tee sdist.txt
          if grep -E '(^|/)(\.venv|site|openspec|\.claude)/|CLAUDE\.md' sdist.txt; then
            echo "files that do not belong in the package"; exit 1
          fi

      - name: Smoke test the wheel
        run: |
          uv venv --no-project smoke
          VIRTUAL_ENV=smoke uv pip install dist/*.whl
          uv run --no-project python scripts/smoke.py smoke/bin/tunedex
